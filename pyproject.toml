[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kogo"
version = "0.1.7"
description = "Layout-aware PDF diff for revisions: added/deleted text, figures, equations, and annotations, in the browser and in marked PDFs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "ta-061" }]
keywords = ["pdf", "diff", "compare", "revision", "proofreading", "redline", "kogo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # 1.27.1 bundles the MuPDF fix for CVE-2026-3308 (heap out-of-bounds
    # write via a crafted PDF's image data, CVSS 7.8).
    "PyMuPDF>=1.27.1,<2",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    # 0.0.30 fixes three known DoS CVEs in multipart/querystring parsing
    # (GHSA-2jv5-9r88-3w3p, GHSA-pp6c-gr5w-3c5g, GHSA-5rvq-cxj2-64vf), all
    # reachable via /api/compare's upload form.
    "python-multipart>=0.0.30,<1",
    # Not imported directly - transitive via fastapi/starlette - but pinned
    # explicitly so an install can't land on a starlette below 0.40.0, which
    # fixes CVE-2024-47874 (unbounded multipart form-field buffering DoS).
    "starlette>=0.40,<2",
]
dev = [
    "httpx",
]
docs = [
    "mkdocs-material>=9,<10",
    "mkdocstrings[python]>=0.26,<1",
    "mkdocs-static-i18n>=1.3,<2",
]

[project.urls]
Homepage = "https://github.com/ta-061/kogo"
Repository = "https://github.com/ta-061/kogo"
Issues = "https://github.com/ta-061/kogo/issues"

[project.scripts]
kogo = "kogo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kogo" = ["py.typed"]
"kogo.server" = [
    "templates/*",
    "static/*.css",
    "static/*.js",
    "static/*.mjs",
    "static/vendor/**/*",
]
