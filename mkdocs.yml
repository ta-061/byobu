site_name: kogo manual
site_description: Layout-aware PDF diff for revisions
site_url: https://kogo.tatu-sec.dev/manual/
repo_url: https://github.com/ta-061/kogo
repo_name: ta-061/kogo
edit_uri: edit/main/docs-src/

docs_dir: docs-src
site_dir: docs/site/manual

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

nav:
  - Quick start: index.md
  - Library API: library-api.md
  - CLI reference: cli.md
  - Web app: web-app.md
  - How it works: architecture.md
  - Recipes:
      - CI integration: recipes/ci-integration.md
      - Batch processing: recipes/batch-processing.md
      - Self-hosting behind auth: recipes/self-hosting-behind-auth.md
      - LaTeX PR review: recipes/latex-ci-review.md
  - FAQ: faq.md
  - Contributing: contributing.md
  - Changelog: changelog.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Quick start: クイックスタート
            Library API: ライブラリ API
            CLI reference: CLI リファレンス
            Web app: Web アプリ
            How it works: 仕組み
            Recipes: レシピ
            CI integration: CI 連携
            Batch processing: バッチ処理
            Self-hosting behind auth: 認証付きセルフホスト
            LaTeX PR review: LaTeX の PR レビュー
            FAQ: よくある質問
            Contributing: コントリビュート
            Changelog: 変更履歴
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            docstring_style: google
            merge_init_into_class: true

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true
