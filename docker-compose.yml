services:
  kogo:
    build: .
    container_name: kogo
    ports:
      - "${KOGO_HOST:-127.0.0.1}:${KOGO_PORT:-8080}:8080"
    environment:
      MAX_UPLOAD_MB: "100"
      MAX_PAGES: "200"
      JOB_TTL_HOURS: "24"
      MAX_CONCURRENT_JOBS: "2"
    volumes:
      - kogo-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Backstop against a single crafted PDF exhausting host resources in the
    # native PyMuPDF/OpenCV parsers; raise if legitimate jobs get OOM-killed.
    mem_limit: 2g
    cpus: 2
    pids_limit: 256

volumes:
  kogo-data:
