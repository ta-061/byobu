name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[serve,dev]'
      - run: python -m unittest discover -s tests -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      # pip itself is excluded from what pip-audit is meant to catch here
      # (kogo's shipped runtime dependencies) - upgrade it first so its own
      # advisories don't fail the job.
      - run: pip install -q --upgrade pip
      - run: pip install -e '.[serve,dev]' pip-audit
      - run: pip-audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t kogo:ci .
      - run: docker run --rm kogo:ci kogo --version
      # Pinned past aquasecurity/trivy-action's March 2026 supply-chain
      # compromise (76 of 77 mutable tags were force-pushed with a credential
      # stealer; see GHSA-69fq-xp46-6x23) - this SHA is v0.36.0, released
      # after remediation. Re-verify against that advisory before bumping.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kogo:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: pip install -e '.[docs]'
      - run: mkdocs build --strict
